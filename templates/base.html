<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BookGlance PRO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: url("{{ url_for('static', filename='images/fondo.jpg') }}") no-repeat center center fixed;
      background-size: cover;
    }
    .navbar {
      background-color: rgba(0,0,0,0.8);
    }
    .card {
      background-color: rgba(255,255,255,0.9);
    }
  </style>
</head>
<body>

  <!-- 🧭 NAVBAR GLOBAL (solo visible para admin) -->
  {% if session.get('role') == 'admin' %}
  <nav class="navbar navbar-dark px-3">
    <span class="navbar-brand">📚 BookGlance</span>
    <div>
      <a class="btn btn-outline-light btn-sm" href="{{ url_for('admin') }}">📦 Productos</a>
      <a class="btn btn-outline-warning btn-sm" href="{{ url_for('caja') }}">💰 Caja</a>
      <a class="btn btn-outline-info btn-sm" href="{{ url_for('ventas') }}">📊 Ventas</a>
      <a class="btn btn-outline-success btn-sm" href="{{ url_for('ticket_ultima') }}">🧾 Ticket</a>
      <a class="btn btn-danger btn-sm" href="{{ url_for('logout') }}">🚪 Salir</a>
    </div>
  </nav>
  {% endif %}

  <div class="container mt-4">
    {% block content %}
    {% endblock %}
  </div>

</body>
</html>
