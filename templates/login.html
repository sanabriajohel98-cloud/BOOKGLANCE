{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg p-4" style="width: 380px; border-radius: 15px;">
    <h3 class="text-center mb-3">📚 <strong>BookGlance PRO</strong></h3>

    {% if error %}
      <div class="alert alert-danger text-center">{{ error }}</div>
    {% endif %}
    {% if mensaje %}
      <div class="alert alert-info text-center">{{ mensaje }}</div>
    {% endif %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" name="usuario" class="form-control" placeholder="Ingresa tu usuario">
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" name="clave" class="form-control" placeholder="Ingresa tu contraseña">
      </div>
      <button class="btn btn-dark w-100 py-2">Entrar</button>
    </form>

    <div class="text-center mt-3">
      <a href="{{ url_for('registro') }}" class="text-decoration-none">Registrarse</a>
    </div>
  </div>
</div>
{% endblock %}
