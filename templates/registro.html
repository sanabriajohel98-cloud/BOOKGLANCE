<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow" style="width:350px;">

<h3>📝Registro Bookglance</h3>

<form method="POST" action="{{ url_for('registro') }}">
    <input class="form-control mb-2" name="usuario" placeholder="Usuario" required>
    <input class="form-control mb-3" name="clave" type="password" placeholder="Contraseña" required>
    <button class="btn btn-primary w-100">Crear cuenta</button>
</form>

{% if error %}
    <div class="alert alert-danger text-center mt-3">{{ error }}</div>
{% endif %}

</div>

</body>
</html>
