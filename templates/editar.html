{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>✏️ Editar Producto</h2>
    <a href="{{ url_for('admin') }}" class="btn btn-secondary mb-3">⬅ Volver</a>
    
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <div class="card p-4" style="max-width: 500px;">
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Código:</label>
                <input class="form-control" name="codigo" value="{{ producto.codigo }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Nombre:</label>
                <input class="form-control" name="nombre" value="{{ producto.nombre }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Precio (Gs.):</label>
                <input class="form-control" name="precio" type="number" step="0.01" value="{{ producto.precio }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Stock:</label>
                <input class="form-control" name="stock" type="number" value="{{ producto.stock }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Imagen:</label>
                <input class="form-control" type="file" name="imagen">
                {% if producto.imagen %}
                    <small class="text-muted d-block mt-2">Imagen actual: {{ producto.imagen }}</small>
                {% endif %}
            </div>
            <button class="btn btn-success w-100">💾 Guardar Cambios</button>
        </form>
    </div>
</div>
{% endblock %}
