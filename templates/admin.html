<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin</title>
</head>
<body>
    <h1>Administrar Productos</h1>

    <!-- Formulario para agregar producto -->
    <form action="/admin" method="POST" enctype="multipart/form-data">
        <label for="codigo">Código:</label>
        <input type="text" name="codigo" id="codigo"><br><br>

        <label for="nombre">Nombre:</label>
        <input type="text" name="nombre" id="nombre" required><br><br>

        <label for="precio">Precio:</label>
        <input type="number" step="0.01" name="precio" id="precio" required><br><br>

        <label for="stock">Stock:</label>
        <input type="number" name="stock" id="stock" required><br><br>

        <label for="imagen">Imagen:</label>
        <input type="file" name="imagen" id="imagen" accept="image/*"><br><br>

        <button type="submit">Guardar Producto</button>
    </form>

    <hr>

    <!-- Lista de productos existentes -->
    <h2>Productos actuales</h2>
    <ul>
        {% for p in productos %}
            <li>
                {{ p.codigo }} - {{ p.nombre }} - ${{ p.precio }} - Stock: {{ p.stock }}
                {% if p.imagen %}
                    <img src="/static/images/{{ p.imagen }}" alt="{{ p.nombre }}" width="80">
                {% endif %}
                <a href="/eliminar/{{ p.id }}">Eliminar</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
