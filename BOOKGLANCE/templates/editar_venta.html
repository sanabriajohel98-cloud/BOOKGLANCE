{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>✏️ Editar Venta</h2>
    <a href="{{ url_for('ventas') }}" class="btn btn-secondary mb-3">⬅ Volver</a>
    
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <div class="card p-4" style="max-width: 500px;">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Producto:</label>
                <input class="form-control" name="producto" value="{{ venta.producto }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Cantidad:</label>
                <input class="form-control" name="cantidad" type="number" value="{{ venta.cantidad }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Total (Gs.):</label>
                <input class="form-control" name="total" type="number" step="0.01" value="{{ venta.total }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Cliente:</label>
                <input class="form-control" name="cliente" value="{{ venta.cliente or '' }}">
            </div>
            <button class="btn btn-success w-100">💾 Guardar Cambios</button>
        </form>
    </div>
</div>
{% endblock %}
